paths:
  /api/v4/events:
    get:
      tags:
      - events
      summary: List currently authenticated user's events
      description: This feature was introduced in GitLab 9.3.
      operationId: getApiV4Events
      parameters:
      - name: scope
        in: query
        description: Include all events across a user’s projects
        schema:
          type: string
      - name: page
        in: query
        description: Current page number
        schema:
          type: integer
          format: int32
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        schema:
          type: integer
          format: int32
          default: 20
      - name: action
        in: query
        description: Event action to filter on
        schema:
          type: string
      - name: target_type
        in: query
        description: Event target type to filter on
        schema:
          type: string
          enum:
          - issue
          - milestone
          - merge_request
          - note
          - project
          - snippet
          - user
          - wiki
          - design
      - name: before
        in: query
        description: Include only events created before this date
        schema:
          type: string
          format: date
      - name: after
        in: query
        description: Include only events created after this date
        schema:
          type: string
          format: date
      - name: sort
        in: query
        description: Return events sorted in ascending and descending order
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      responses:
        '200':
          description: List currently authenticated user's events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/API_Entities_Event'
        '401':
          description: Unauthorized
          content: {}
  /api/v4/projects/{id}:
    get:
      tags:
      - projects
      description: Get a single project
      operationId: getApiV4ProjectsId
      parameters:
      - name: id
        in: path
        description: The ID or URL-encoded path of the project
        required: true
        schema:
          type: string
      - name: statistics
        in: query
        description: Include project statistics
        schema:
          type: boolean
          default: false
      - name: with_custom_attributes
        in: query
        description: Include custom attributes in the response
        schema:
          type: boolean
          default: false
      - name: license
        in: query
        description: Include project license data
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Get a single project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_ProjectWithAccess'
    put:
      tags:
      - projects
      description: Update an existing project
      operationId: putApiV4ProjectsId
      parameters:
      - name: id
        in: path
        description: The ID or URL-encoded path of the project
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/putApiV4ProjectsId'
        required: true
      responses:
        '200':
          description: Update an existing project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Project'
        '400':
          description: Bad request
          content: {}
        '403':
          description: Unauthenticated
          content: {}
      x-codegen-request-body-name: putApiV4ProjectsId
    delete:
      tags:
      - projects
      description: Delete a project
      operationId: deleteApiV4ProjectsId
      parameters:
      - name: id
        in: path
        description: The ID or URL-encoded path of the project
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Delete a project
          content: {}
        '403':
          description: Unauthenticated
          content: {}
        '404':
          description: Not found
          content: {}
  /api/v4/projects/{id}/repository/commits:
    get:
      tags:
      - commits
      description: Get a project repository commits
      operationId: getApiV4ProjectsIdRepositoryCommits
      parameters:
      - name: id
        in: path
        description: The ID or URL-encoded path of the project
        required: true
        schema:
          type: string
      - name: ref_name
        in: query
        description: The name of a repository branch or tag, if not given the default branch is used
        schema:
          type: string
      - name: since
        in: query
        description: Only commits after or on this date will be returned
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Only commits before or on this date will be returned
        schema:
          type: string
          format: date-time
      - name: path
        in: query
        description: The file path
        schema:
          type: string
      - name: author
        in: query
        description: Search commits by commit author
        schema:
          type: string
      - name: all
        in: query
        description: Every commit will be returned
        schema:
          type: boolean
      - name: with_stats
        in: query
        description: Stats about each commit will be added to the response
        schema:
          type: boolean
      - name: first_parent
        in: query
        description: Only include the first parent of merges
        schema:
          type: boolean
      - name: order
        in: query
        description: List commits in order
        schema:
          type: string
          default: default
          enum:
          - default
          - topo
      - name: trailers
        in: query
        description: Parse and include Git trailers for every commit
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        description: Current page number
        schema:
          type: integer
          format: int32
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: Get a project repository commits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/API_Entities_Commit'
        '400':
          description: Bad request
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '404':
          description: Not found
          content: {}
    post:
      tags:
      - commits
      summary: Commit multiple file changes as one commit
      description: This feature was introduced in GitLab 8.13
      operationId: postApiV4ProjectsIdRepositoryCommits
      parameters:
      - name: id
        in: path
        description: The ID or URL-encoded path of the project
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiV4ProjectsIdRepositoryCommits'
        required: true
      responses:
        '200':
          description: Commit multiple file changes as one commit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_CommitDetail'
        '400':
          description: Bad request
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: Not found
          content: {}
      x-codegen-request-body-name: postApiV4ProjectsIdRepositoryCommits
components:
  schemas:
