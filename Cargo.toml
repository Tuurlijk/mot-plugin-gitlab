[package]
name = "mot-plugin-gitlab"
version = "0.2.4"
description = "GitLab Activity Plugin for MOT"
edition = "2021"
authors = ["Michiel Roos <mot.free.bra@michielroos.com>"]
license = "MIT"
repository = "https://github.com/Tuurlijk/mot-plugin-gitlab"
keywords = ["tui", "mot", "gitlab", "plugin", "cli"]
categories = ["command-line-utilities", "visualization"]
readme = "README.md"

[dependencies]
jsonrpc-core = "18.0"
jsonrpc-stdio-server = "18.0"
anyhow = "1.0.97"
chrono = { version = "0.4.40", features = ["serde"] }
config = "0.15.11"
dirs = "6.0.0"
reqwest = { version = "0.12.14", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
progenitor-client = "0.9.1"
tokio = { version = "1.0.0", features = ["rt-multi-thread", "macros", "time"] }
log = "0.4.27"
env_logger = "0.11.8"
once_cell = { version = "1.21.3", features = ["std"] }

[build-dependencies]
prettyplease = "0.2.22"
progenitor = "0.9.1"
serde_yaml_ng = "0.10.0"
syn = "2.0"
regex = "1.10.3"